<linearGradient id="porcelain" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".64" stop-color="#E9F5FF"/><stop offset="1" stop-color="#8BCBFF"/></linearGradient>
<filter id="blue-light" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter></defs>
<rect width="640" height="640" rx="136" fill="url(#field)"/><circle cx="320" cy="320" r="248" fill="none" stroke="#0D61FF" stroke-width="13" opacity=".19" filter="url(#blue-light)"/>
