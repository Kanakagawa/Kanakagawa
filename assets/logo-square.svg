<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
<title id="title">Kanakagawa project logo, electric blue edition</title>
<desc id="desc">Original vector artwork for Alexandr / Ice. Lettering is outlined for consistent rendering.</desc>
<defs><linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070D20"/><stop offset=".68" stop-color="#081631"/><stop offset="1" stop-color="#073980"/></linearGradient>
